name: Keep Render Awake

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping BGL VOBI health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            https://bgl-vobi-relatorio.onrender.com/health
